# CI Android/Dart: phân tích + unit/widget test trên Ubuntu.
# 2026-11-05: hết phút Actions → CHỈ chạy khi push lên `main` (đã kiểm cục bộ trên nhánh `dev` rồi mới gộp),
# bỏ qua commit chỉ đổi tài liệu; nhánh khác muốn chạy thì bấm tay (workflow_dispatch). Không chạy theo PR.
# Ghim Flutter 3.47.8 cho khớp máy phát triển (D-003). iOS ở ios.yml (macOS, chỉ nhánh main).
# 2026-11-06: có bản sao tại sun-moonstars/A002 để build/test khi repo chính hết phút Actions; chạy tay (workflow_dispatch) trên nhánh `dev`.
name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'store/**'
      - 'design/**'
      - 'notes/**'
      - 'tool/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    name: Analyze + test (Android/Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Cài gói
        run: flutter pub get
      - name: Phân tích
        run: flutter analyze
      - name: Test
        run: flutter test
