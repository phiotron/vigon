# CI Android/Dart: phân tích + unit/widget test trên Ubuntu (rẻ), chạy mọi push và PR.
# Ghim Flutter 3.47.8 cho khớp máy phát triển (D-003). iOS ở ios.yml (macOS, chỉ nhánh main).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    name: Analyze + test (Android/Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Cài gói
        run: flutter pub get
      - name: Phân tích
        run: flutter analyze
      - name: Test
        run: flutter test
