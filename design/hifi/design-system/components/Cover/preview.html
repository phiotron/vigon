<!doctype html>
<html><head><meta charset="utf-8"><style>
.cv{position:relative;width:960px;height:300px;background:var(--surface);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;left:0;top:0}
.b-deep{fill:var(--brand-deep)} .b-mint{fill:var(--brand-mint)} .b-pri{fill:var(--primary-container)} .b-exp{fill:var(--expense)} .b-inc{fill:var(--income)} .b-dot{fill:var(--brand-dot)} .b-paper{fill:var(--brand-paper)}
.cv .nm{position:absolute;left:48px;bottom:92px;font:700 112px/1 var(--font-sans);color:var(--ink);letter-spacing:-2px}
.cv .tg{position:absolute;left:52px;bottom:40px;font:400 14px/20px var(--font-sans);color:var(--ink-muted);max-width:420px}
</style></head><body style="margin:0"><div class="cv">
<!-- derivation:
 blocks: brand-deep 216x300 slab (bleeds top/bottom), brand-mint card 200x128, primary-container card 160x104, expense 64x64 / income 64x64 squares at radius-lg, brand-dot disc r=16
 arrangement: one tall slab with satellites — two cards stacked and rotated (-14deg / +8deg) like the logo, the two money squares as the − / + pair below
 pattern row: "a literal motif" — the two stacked cards of the logo, cut from radius-xl (28) corners; chosen because the brand is literally two cards
 steps/radii: space-4 (16) gaps, space-8 (32) margins, radius-xl 28 on cards, radius-lg 16 on squares
-->
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<rect class="b-deep" x="744" y="-10" width="216" height="320"/>
<g transform="translate(640 120) rotate(-14)"><rect class="b-mint" x="-100" y="-64" width="200" height="128" rx="28"/></g>
<g transform="translate(700 150) rotate(8)"><rect class="b-paper" x="-104" y="-66" width="208" height="132" rx="28" style="stroke:var(--outline-variant);stroke-width:1"/>
<rect class="b-deep" x="-74" y="-30" width="92" height="16" rx="8"/><rect class="b-deep" x="-74" y="-2" width="56" height="14" rx="7" style="opacity:.35"/><circle class="b-dot" cx="62" cy="4" r="20"/></g>
<rect class="b-exp" x="560" y="236" width="64" height="64" rx="16"/><rect class="b-inc" x="640" y="236" width="64" height="64" rx="16"/>
<rect class="b-pri" x="784" y="32" width="136" height="88" rx="28"/>
</svg>
<div class="nm">Ví Gọn</div><div class="tg">Record income and expenses in seconds — offline, private, by category. Design system v2.</div>
</div></body></html>
